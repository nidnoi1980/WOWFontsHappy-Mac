name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Download upstream v1.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _upstream
          curl -fL --retry 3 \
            -o _upstream/upstream.zip \
            https://github.com/huchang47/WOWFontsHappy/archive/refs/tags/v1.1.zip
          unzip -q _upstream/upstream.zip -d _upstream
          SRC_DIR="$(find _upstream -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC_DIR"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Using upstream source: $SRC_DIR"

      - name: Apply macOS port patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          git init -q
          git apply "$GITHUB_WORKSPACE/patches/01-newfiles.patch"
          git apply "$GITHUB_WORKSPACE/patches/02-server.patch"
          git apply "$GITHUB_WORKSPACE/patches/03-ui.patch"
          git apply "$GITHUB_WORKSPACE/patches/04-package.patch"
          echo "Patches applied successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          npm ci

      - name: Install Electron packaging tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          npm install --no-save --package-lock=false electron@37.2.4 electron-builder@26.0.12

      - name: Syntax check
        shell: bash
        run: |
          cd "$SRC_DIR"
          npm run check

      - name: Run macOS path and API smoke test
        shell: bash
        run: |
          cd "$SRC_DIR"
          node .github/scripts/mac_smoke_test.js

      - name: Build unsigned Intel and Apple Silicon apps
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          npx electron-builder --mac --x64 --arm64
          echo "Build output:"
          find dist-mac -maxdepth 2 -type f -print

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: WoWFontsHappy-macOS-1.3.0
          path: |
            ${{ env.SRC_DIR }}/dist-mac/*.dmg
            ${{ env.SRC_DIR }}/dist-mac/*.zip
          if-no-files-found: error
          retention-days: 14
